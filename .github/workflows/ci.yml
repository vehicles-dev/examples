name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript / Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r python/requirements.txt
      - run: python -m unittest discover -s python -p 'test_*.py'
      - run: python -m compileall -q python
      - run: PYTHONPATH=python python -c 'import common, decode_vin, order_history_report, search_listings'
